[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-sales-aws-etl"
version = "0.1.0"
description = "AWS-local foundation for the ecommerce sales ETL pipeline"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34,<2",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
