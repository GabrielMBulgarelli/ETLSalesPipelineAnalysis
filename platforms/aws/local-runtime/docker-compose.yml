name: ecommerce-sales-aws-local

services:
  localstack:
    image: docker.io/localstack/localstack:4.6.0
    container_name: ecommerce-sales-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "${LOCALSTACK_DEBUG:-0}"
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  postgres:
    image: docker.io/library/postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    platform: linux/amd64
    container_name: ecommerce-sales-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ecommerce_sales}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-ecommerce_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s

volumes:
  localstack-data:
  postgres-data:
